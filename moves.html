<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>招式表 · PokéSurvivor 攻略</title>
<meta name="description" content="PokéSurvivor 全部 64 招式：依屬性分組，含招式類型、中毒層數、Lv5 進化與所需能力卡。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem('psg-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body data-page="moves">
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html"><b>PokéSurvivor</b><span>攻略・圖鑑</span></a>
    <nav class="nav" aria-label="主選單">
      <a href="index.html" data-nav="guide">攻略</a>
      <a href="dex.html" data-nav="dex">圖鑑</a>
      <a href="moves.html" data-nav="moves">招式表</a>
    </nav>
    <button id="theme-btn" class="theme-btn" type="button">淺色</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-bottom:4px">
    <h1>招式表</h1>
    <p class="lead">共 64 招，依屬性分組。Lv5 的招式可用指定的能力卡進化（進化條件為理論值，未實測）。</p>
  </section>

  <section class="toolbar card" aria-label="篩選條件">
    <div class="row">
      <label class="field" style="flex:1 1 260px">
        <span>搜尋</span>
        <input id="q" type="search" placeholder="招式中文或英文，例如：毒菱 / Toxic / Earthquake" autocomplete="off">
      </label>
      <button id="f-poison" class="btn" type="button" aria-pressed="false">只看中毒招式</button>
      <button id="f-reset" class="btn" type="button">清除</button>
    </div>
    <div class="chips-box" id="jump" aria-label="跳到屬性"></div>
    <p id="count" class="count" aria-live="polite"></p>
  </section>

  <details class="card">
    <summary><b>招式類型說明</b></summary>
    <ul class="bul" id="kind-legend" style="margin-top:10px"></ul>
  </details>

  <noscript><p class="note warn">這個頁面需要開啟 JavaScript 才能顯示資料。</p></noscript>
  <div id="groups"></div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>PokéSurvivor 為 JPTER78 製作的粉絲遊戲（fan project）。圖片來源：PokeAPI/sprites。資料取自遊戲公開原始碼。</p>
    <p>寶可夢 © Nintendo / Creatures / GAME FREAK。本站為非官方粉絲網站，所有數值為理論值、未實測。</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/moves.js"></script>
</body>
</html>
