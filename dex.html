<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>寶可夢圖鑑 · PokéSurvivor 攻略</title>
<meta name="description" content="PokéSurvivor 寶可夢圖鑑：數值、屬性弱點、可學招式與進化條件（理論值，未實測）。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem('psg-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
</head>
<body data-page="dex">
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html"><b>PokéSurvivor</b><span>攻略・圖鑑</span></a>
    <nav class="nav" aria-label="主選單">
      <a href="index.html" data-nav="guide">攻略</a>
      <a href="dex.html" data-nav="dex">圖鑑</a>
      <a href="moves.html" data-nav="moves">招式表</a>
    </nav>
    <button id="theme-btn" class="theme-btn" type="button">淺色</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding-bottom:4px">
    <h1>寶可夢圖鑑</h1>
    <p class="lead">共 965 隻夥伴。可依屬性、星級、世代、傳說與毒系篩選，點卡片查看可學招式、進化條件與受傷倍率（理論值，未實測）。</p>
  </section>

  <section class="toolbar card" aria-label="篩選條件">
    <div class="row">
      <label class="field" style="flex:1 1 260px">
        <span>搜尋</span>
        <input id="q" type="search" placeholder="中文、英文或編號，例如：大食花 / Victreebel / 71" autocomplete="off">
      </label>
      <button id="f-reset" class="btn" type="button">清除篩選</button>
    </div>
    <div class="row" style="align-items:flex-start">
      <div class="field" style="flex:1 1 320px">
        <span>屬性（可複選）</span>
        <div id="f-types" class="chips-box"></div>
      </div>
      <label class="field">符合方式
        <select id="tmode">
          <option value="any">符合任一</option>
          <option value="all">全部符合</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="field">星級
        <select id="f-star"></select>
      </label>
      <label class="field">世代
        <select id="f-gen"></select>
      </label>
      <label class="field">排序
        <select id="f-sort">
          <option value="no">圖鑑編號</option>
          <option value="atk">攻擊（高到低）</option>
          <option value="hp">血量（高到低）</option>
          <option value="spd">速度（高到低）</option>
          <option value="comp">綜合（血 × 速 × 攻）</option>
        </select>
      </label>
      <button id="f-leg" class="btn" type="button" aria-pressed="false">只看傳說</button>
      <button id="f-poison" class="btn" type="button" aria-pressed="false">只看毒系</button>
    </div>
    <p id="count" class="count" aria-live="polite"></p>
  </section>

  <noscript><p class="note warn">這個頁面需要開啟 JavaScript 才能顯示資料。</p></noscript>
  <div id="grid" class="grid"></div>
</main>

<dialog id="detail" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <div id="dlg-pic" class="dlg-pic"></div>
    <div id="dlg-info"></div>
    <button id="dlg-close" class="dlg-close" type="button">關閉</button>
  </div>
  <div id="dlg-body" class="dlg-body"></div>
</dialog>

<footer class="site-foot">
  <div class="wrap">
    <p>PokéSurvivor 為 JPTER78 製作的粉絲遊戲（fan project）。圖片來源：PokeAPI/sprites。資料取自遊戲公開原始碼。</p>
    <p>寶可夢 © Nintendo / Creatures / GAME FREAK。本站為非官方粉絲網站，所有數值為理論值、未實測。</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/dex.js"></script>
</body>
</html>
